<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff7eb3">
  <title>Прости меня, любовь моя 💗</title>
  <style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{background:linear-gradient(145deg,#ff9bc4 0%,#ff7eb3 48%,#ffb6d2 100%);color:#4b1830;overflow-x:hidden}
.page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;position:relative}
.card,.success{width:min(100%,430px);background:rgba(255,246,250,.97);border-radius:30px;padding:24px 20px 28px;text-align:center;box-shadow:0 18px 50px rgba(104,18,57,.22);position:relative;z-index:2}
.top-heart{font-size:34px;animation:pulse 1.5s infinite}
h1{font-size:27px;line-height:1.15;margin:8px 0 18px}
.picture-wrap{background:#fff;border-radius:22px;padding:10px;box-shadow:0 8px 25px rgba(110,35,65,.12);margin:0 auto 18px;max-width:330px}
.picture-wrap img{display:block;width:100%;height:auto;border-radius:16px}
p{font-size:17px;line-height:1.45;margin:12px auto 20px;max-width:330px;font-weight:600}
.buttons{display:flex;align-items:center;justify-content:center;gap:16px;min-height:62px;position:relative}
button{border:0;font:inherit;font-weight:800;cursor:pointer;-webkit-tap-highlight-color:transparent}
.yes{background:#ff4f9a;color:#fff;border-radius:999px;padding:15px 32px;font-size:20px;box-shadow:0 9px 20px rgba(255,79,154,.3);transition:transform .15s}
.yes:active{transform:scale(.96)}
.no{background:#fff;color:#8d4668;border:2px solid #f3b7cf;border-radius:999px;padding:8px 15px;font-size:13px;position:relative;transition:all .18s}
.hint{font-size:13px;color:#a45a7a;margin-top:12px;min-height:20px}
.hidden{display:none}
.success h2{font-size:29px;margin:8px 0 12px}
.success p{font-weight:600}
.success-emoji{font-size:50px}
.big-heart{font-size:80px;animation:pulse 1.1s infinite}
.again{background:#fff;color:#d13e78;border:2px solid #f3b7cf;border-radius:999px;padding:11px 18px;margin-top:8px}
.hearts:before,.hearts:after{content:"❤️";position:fixed;font-size:26px;opacity:.35;animation:float 7s linear infinite;left:8%;bottom:-40px}
.hearts:after{content:"💗";left:78%;font-size:22px;animation-delay:2s}
@keyframes pulse{50%{transform:scale(1.08)}}
@keyframes float{to{transform:translateY(-110vh) rotate(20deg);opacity:0}}
@media(max-width:380px){h1{font-size:24px}.card,.success{padding:20px 15px 24px}.yes{padding:13px 26px}}

</style>
</head>
<body>

    <section class="card" id="card">
      <div class="top-heart">💗</div>
      <h1>Прости меня, моя любовь? 💔</h1>

      </div>

      <p id="message">Мне правда очень жаль… Я не хочу, чтобы между нами оставалась обида 🥺</p>

      <div class="buttons" id="buttons">
        <button class="no" id="noBtn" type="button">Нет 🙈</button>
        <button class="yes" id="yesBtn" type="button">Да 💖</button>
      </div>

      <div class="hint" id="hint">Ну пожалуйста… 🥹</div>
    </section>

    <section class="success hidden" id="success">
      <div class="success-emoji">🥰💞</div>
      <h2>Ура! Ты меня простила ❤️</h2>
      <p>Спасибо тебе. Я очень тебя люблю и обещаю беречь наши отношения.</p>
      <div class="big-heart">❤️</div>
      <button class="again" id="againBtn" type="button">Ещё раз посмотреть 💌</button>
    </section>
  </main>

  <script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const card = document.getElementById("card");
const success = document.getElementById("success");
const message = document.getElementById("message");
const hint = document.getElementById("hint");
const againBtn = document.getElementById("againBtn");

const phrases = [
  "Ну пожалуйста… 🥹",
  "Точно нет? Я очень стараюсь ❤️",
  "А если я очень-очень попрошу? 🥺",
  "Не убегай от меня 😭",
  "Последний шанс… 💗"
];
let noCount = 0;

function moveNoButton(){
  noCount++;
  hint.textContent = phrases[Math.min(noCount - 1, phrases.length - 1)];

  const box = noBtn.parentElement.getBoundingClientRect();
  const maxX = Math.max(20, Math.min(100, box.width / 2 - 35));
  const maxY = 35;
  const x = (Math.random() * 2 - 1) * maxX;
  const y = (Math.random() * 2 - 1) * maxY;
  noBtn.style.transform = `translate(${x}px,${y}px)`;

  if(noCount >= 5){
    noBtn.textContent = "Ну ладно… 🥺";
  }
}

noBtn.addEventListener("mouseenter", moveNoButton);
noBtn.addEventListener("touchstart", (e) => {
  e.preventDefault();
  moveNoButton();
}, {passive:false});
noBtn.addEventListener("click", moveNoButton);

yesBtn.addEventListener("click", () => {
  card.classList.add("hidden");
  success.classList.remove("hidden");
  window.scrollTo({top:0,behavior:"smooth"});
});

againBtn.addEventListener("click", () => {
  success.classList.add("hidden");
  card.classList.remove("hidden");
  noCount = 0;
  noBtn.textContent = "Нет 🙈";
  noBtn.style.transform = "translate(0,0)";
  hint.textContent = "Ну пожалуйста… 🥹";
});

</script>

</html>
